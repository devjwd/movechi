name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    name: Frontend Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Use mainnet values for build test
          VITE_CONTRACT_ADDRESS: "0xfb232241c37c2006ccfd2d36a0ac18f8baff7fa06a3336ba88cfebcfc7a54ac3"
          VITE_MODULE_NAME: "main"
          VITE_COLLECTION_ID: "0x4c28d9362f440dedec5013742fb21fd4693b56add430e9a5874b220b681053ae"
          VITE_FULLNODE_URL: "https://mainnet.movementnetwork.xyz/v1"
          VITE_FAUCET_URL: "https://mainnet.movementnetwork.xyz/v1"
          VITE_EXPLORER_URL: "https://explorer.movementnetwork.xyz/?network=mainnet"

      - name: Check build output
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "❌ Build failed - dist folder not found"
            exit 1
          fi
          echo "✅ Build successful"
